name: HPC command

# "/hpc" or "/hpc validation,scaling" as a pull request comment starts the HPC
# workflow for the pull request's head commit, also from forks. The workflow
# definitions come from the default branch, the code from the commit pinned
# here. Only users whose role on the repository is listed in
# HPC_COMMAND_ROLES (default "admin maintain") may start it.

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/hpc') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      BODY: ${{ github.event.comment.body }}
      AUTHOR: ${{ github.event.comment.user.login }}
      NUMBER: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      ROLES: ${{ vars.HPC_COMMAND_ROLES || 'admin maintain' }}
    steps:
      - name: Check the command and the author
        id: check
        run: |
          set -euo pipefail
          react() { gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content="$1" > /dev/null; }
          reply() { gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -f body="$1" > /dev/null; }
          deny() { react -1; reply "$1"; exit 1; }

          command=$(head -n 1 <<< "$BODY" | tr -d '\r')
          [[ $command =~ ^/hpc([[:space:]]+([a-z,]+))?[[:space:]]*$ ]] || exit 0
          families=${BASH_REMATCH[2]:-validation}
          [[ $families =~ ^(validation|scaling)(,(validation|scaling))*$ ]] \
            || deny "Unknown families \`$families\`, use \`validation\`, \`scaling\` or both separated by a comma."

          role=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq .role_name)
          read -r -a allowed <<< "$ROLES"
          [[ " ${allowed[*]} " == *" $role "* ]] \
            || deny "@$AUTHOR, cluster runs can only be started by roles \`$ROLES\`; yours is \`$role\`."

          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER")
          [ "$(jq -r .state <<< "$pr")" = open ] || deny "This pull request is not open."
          sha=$(jq -r .head.sha <<< "$pr")
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || deny "Could not determine the head commit of this pull request."

          echo "families=$families" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "head=$(jq -r .head.label <<< "$pr")" >> "$GITHUB_OUTPUT"
          react eyes
      - name: Start the HPC workflow
        if: steps.check.outputs.sha != ''
        env:
          FAMILIES: ${{ steps.check.outputs.families }}
          SHA: ${{ steps.check.outputs.sha }}
          HEAD: ${{ steps.check.outputs.head }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh workflow run hpc.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
            -f families="$FAMILIES" -f pr="$NUMBER" -f sha="$SHA"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=rocket > /dev/null
          runs="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/hpc.yml"
          gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" \
            -f body="Started the cluster run of \`$FAMILIES\` for \`$HEAD\` at ${SHA:0:7}, requested by @$AUTHOR. Later pushes need a new \`/hpc\`. [Workflow runs]($runs), the results appear as checks on the commit." > /dev/null
