name: HPC

# Runs the long simulations on the Otus Slurm runner through the GitLab
# mirror and brings the results back. Secrets: GITLAB_TOKEN (project access
# token, scope read_api, plus write_repository when pushing) and
# GITLAB_TRIGGER_TOKEN. Variables: GITLAB_PROJECT_ID, optionally GITLAB_HOST,
# GITLAB_PROJECT_PATH, GITLAB_MIRROR (pull, the default, waits for the
# project's pull mirror; push pushes the commit), BENCHMARK_BRANCH (branch
# holding the benchmark history and dashboard, default hpc-results),
# ALERT_THRESHOLD and FAIL_THRESHOLD (ratios to the previous result, default
# 115% and 150%). With pr and sha, started by hpc-command.yml on the default
# branch, the jobs run that pull request commit, from this repository or a
# fork, and the results are compared but not recorded.

run-name: ${{ inputs.pr && format('HPC pull request {0}', inputs.pr) || 'HPC' }}

on:
  workflow_dispatch:
    inputs:
      families:
        description: Job families to run (comma separated from validation, scaling)
        type: string
        default: validation
      pipeline_id:
        description: Attach to a running GitLab pipeline instead of starting one
        type: string
        default: ''
      pr:
        description: Pull request number, set by the /hpc comment command
        type: string
        default: ''
      sha:
        description: Commit of the pull request to run, set by the /hpc comment command
        type: string
        default: ''
  # Weekly validation of main, disabled. Remove the comment signs to enable;
  # a scheduled run uses the family default below.
  # schedule:
  #   - cron: '0 3 * * 1'

permissions:
  contents: write
  statuses: write
  checks: write
  actions: write
  pull-requests: write

env:
  FAMILIES: ${{ inputs.families || 'validation' }}
  GITLAB_HOST: ${{ vars.GITLAB_HOST || 'git.uni-paderborn.de' }}
  GITLAB_PROJECT_ID: ${{ vars.GITLAB_PROJECT_ID }}
  GITLAB_PROJECT_PATH: ${{ vars.GITLAB_PROJECT_PATH || 'pc2-ci/julia/MaxwellTrixi.jl' }}
  GITLAB_MIRROR: ${{ vars.GITLAB_MIRROR || 'pull' }}
  GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
  BENCHMARK_BRANCH: ${{ vars.BENCHMARK_BRANCH || 'hpc-results' }}
  ALERT_THRESHOLD: ${{ vars.ALERT_THRESHOLD || '115%' }}
  FAIL_THRESHOLD: ${{ vars.FAIL_THRESHOLD || '150%' }}
  CHECKOUT_SHA: ${{ inputs.sha }}
  CHECKOUT_REPOSITORY: ${{ inputs.sha && format('{0}/{1}.git', github.server_url, github.repository) || '' }}
  RECORD: ${{ github.ref_name == 'main' && !inputs.sha }}

jobs:
  start:
    name: Start on the mirror
    if: ${{ !inputs.pipeline_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      pipeline_id: ${{ steps.start.outputs.pipeline_id }}
      web_url: ${{ steps.start.outputs.web_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Wait for the pull mirror to fetch the commit
        if: env.GITLAB_MIRROR != 'push'
        run: ci/gitlab_pipeline.sh mirrored "$GITHUB_SHA" 60
      - name: Push the commit to the mirror
        if: env.GITLAB_MIRROR == 'push'
        run: ci/gitlab_pipeline.sh push "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Start the pipeline
        id: start
        run: ci/gitlab_pipeline.sh start "$GITHUB_REF_NAME" "$FAMILIES" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        env:
          GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
      - name: Commit status
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/${{ steps.start.outputs.sha || github.sha }}" -f state=pending -f context=gitlab/hpc \
            -f target_url="${{ steps.start.outputs.web_url }}" -f description="pipeline ${{ steps.start.outputs.pipeline_id }} started"
        env:
          GH_TOKEN: ${{ github.token }}

  wait:
    name: Wait for Slurm
    needs: start
    if: ${{ !cancelled() && (needs.start.result == 'success' || inputs.pipeline_id) }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      PIPELINE_ID: ${{ inputs.pipeline_id || needs.start.outputs.pipeline_id }}
    outputs:
      finished: ${{ steps.wait.outputs.finished }}
      pipeline_id: ${{ env.PIPELINE_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Poll the pipeline
        id: wait
        run: ci/gitlab_pipeline.sh wait "$PIPELINE_ID" 330
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Hand over to a new run
        if: steps.wait.outputs.finished != 'true'
        run: |
          gh workflow run hpc.yml --ref "$GITHUB_REF_NAME" -f families="$FAMILIES" -f pipeline_id="$PIPELINE_ID" \
            -f pr="$PR" -f sha="$CHECKOUT_SHA"
          echo "Pipeline $PIPELINE_ID still running, a new run of this workflow continues waiting." >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}

  collect:
    name: Collect results
    needs: wait
    if: ${{ !cancelled() && needs.wait.outputs.finished == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: hpc-results
      cancel-in-progress: false
    env:
      PIPELINE_ID: ${{ needs.wait.outputs.pipeline_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download artifacts and summarize
        id: collect
        run: ci/gitlab_pipeline.sh collect "$PIPELINE_ID"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hpc-results-${{ env.PIPELINE_ID }}
          path: results
          if-no-files-found: warn
          retention-days: 90
      - name: Convert the metrics for the benchmark action
        id: convert
        if: ${{ always() && steps.collect.outputs.sha != '' }}
        run: |
          for family in validation scaling; do
            ci/results.sh benchmark results "$family" pipeline.json > "benchmark-$family.json"
            echo "$family=$(jq 'length > 0' "benchmark-$family.json")" >> "$GITHUB_OUTPUT"
          done
          # the action needs the branch; an empty root commit starts it
          if ! git ls-remote --exit-code --heads origin "$BENCHMARK_BRANCH" > /dev/null; then
            root=$(git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit-tree "$(git hash-object -t tree /dev/null)" -m "benchmark history")
            git push -q origin "${root}:refs/heads/$BENCHMARK_BRANCH"
          fi
          git fetch -q origin "$BENCHMARK_BRANCH:$BENCHMARK_BRANCH"
      - name: Record the validation results
        id: bench_validation
        if: ${{ always() && steps.convert.outputs.validation == 'true' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: HPC validation
          tool: customSmallerIsBetter
          output-file-path: benchmark-validation.json
          ref: ${{ steps.collect.outputs.sha }}
          github-token: ${{ github.token }}
          gh-pages-branch: ${{ env.BENCHMARK_BRANCH }}
          benchmark-data-dir-path: bench
          skip-fetch-gh-pages: true
          auto-push: ${{ env.RECORD == 'true' }}
          summary-always: true
          comment-always: ${{ env.RECORD != 'true' }}
          comment-on-alert: true
          alert-threshold: ${{ env.ALERT_THRESHOLD }}
          fail-on-alert: true
          fail-threshold: ${{ env.FAIL_THRESHOLD }}
      - name: Record the scaling results
        id: bench_scaling
        if: ${{ always() && steps.convert.outputs.scaling == 'true' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: HPC scaling
          tool: customSmallerIsBetter
          output-file-path: benchmark-scaling.json
          ref: ${{ steps.collect.outputs.sha }}
          github-token: ${{ github.token }}
          gh-pages-branch: ${{ env.BENCHMARK_BRANCH }}
          benchmark-data-dir-path: bench
          skip-fetch-gh-pages: true
          auto-push: ${{ env.RECORD == 'true' }}
          summary-always: true
          comment-always: ${{ env.RECORD != 'true' }}
          comment-on-alert: true
          alert-threshold: ${{ env.ALERT_THRESHOLD }}
          fail-on-alert: true
          fail-threshold: ${{ env.FAIL_THRESHOLD }}
      - name: Rebuild the documentation with the new history
        if: ${{ always() && steps.collect.outputs.sha != '' && env.RECORD == 'true' }}
        run: gh workflow run docs.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          check_name: HPC checks
          report_paths: results/**/junit.xml
          commit: ${{ steps.collect.outputs.sha || github.sha }}
          require_tests: false
          include_passed: true
          detailed_summary: true
      - name: Commit status
        if: always()
        run: |
          state=failure
          if [ "${{ steps.collect.outputs.status }}" = success ]; then state=success; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/${{ steps.collect.outputs.sha || github.sha }}" -f state=$state -f context=gitlab/hpc \
            -f target_url="${{ steps.collect.outputs.web_url }}" -f description="pipeline $PIPELINE_ID ${{ steps.collect.outputs.status }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Report to the pull request
        if: ${{ always() && inputs.pr != '' }}
        run: |
          regression=
          if [ "$BENCH_VALIDATION" = failure ] || [ "$BENCH_SCALING" = failure ]; then
            regression=" Performance or accuracy got worse beyond $FAIL_THRESHOLD of the latest \`main\` run, see the comparison comment on the commit."
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --silent -f body="Cluster run of \`$FAMILIES\` at ${CHECKOUT_SHA:0:7} finished with pipeline status **$STATUS**.$regression

          [Run summary]($run_url) · [GitLab pipeline]($WEB_URL)"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          STATUS: ${{ steps.collect.outputs.status || 'unknown' }}
          WEB_URL: ${{ steps.collect.outputs.web_url }}
          BENCH_VALIDATION: ${{ steps.bench_validation.outcome }}
          BENCH_SCALING: ${{ steps.bench_scaling.outcome }}
