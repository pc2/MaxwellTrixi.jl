# Long simulations on the Otus Slurm runner. Pipelines start from GitHub
# (.github/workflows/hpc.yml) or from the GitLab UI, never on pushes to the
# mirror. FAMILIES selects the job families, comma separated:
# validation, sweep, scaling.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - if: $CI_PIPELINE_SOURCE == "web"

stages: [prepare, run]

variables:
  SCHEDULER_BASE: "-A pc2-mitarbeiter -p normal --mem-per-cpu=3800M"
  JULIA_PKG_PRECOMPILE_AUTO: "0"
  OPENBLAS_NUM_THREADS: "1"
  FAMILIES: "validation"
  GIT_DEPTH: "1"

default:
  tags: [otus-slurm]
  # Jacamar authenticates each job with this token
  id_tokens:
    CI_JOB_JWT:
      aud: https://git.uni-paderborn.de
  before_script:
    - test -n "$CI_DEPOT_ROOT" || { echo "CI_DEPOT_ROOT is not set"; exit 1; }
    - module load lang/JuliaHPC/1.13.1-foss-2025a
    # our depot first, then whatever the module set or Julia's bundled depots
    - export JULIA_DEPOT_PATH="$CI_DEPOT_ROOT/julia-depot:${JULIA_DEPOT_PATH:-}"
    # MPI through MPItrampoline and the MPIwrapper built by prepare, see hpc/preferences
    - export JULIA_LOAD_PATH="@:$CI_PROJECT_DIR/hpc/preferences:${JULIA_LOAD_PATH:-}"
    - export MPITRAMPOLINE_LIB=$(ls "$CI_DEPOT_ROOT"/mpiwrapper/lib*/libmpiwrapper.so 2>/dev/null | head -n 1)
    - export MPITRAMPOLINE_MPIEXEC="$CI_DEPOT_ROOT/mpiwrapper/bin/mpiwrapperexec"
    # UCX must not install its signal handlers, Julia's garbage collector relies on handling the fault itself
    - export UCX_ERROR_SIGNALS=
    - export UCX_WARN_UNUSED_ENV_VARS=n
    # login and compute nodes are AMD EPYC 9655
    - export JULIA_CPU_TARGET=znver5
    - export JULIA_NUM_THREADS=${SLURM_CPUS_PER_TASK:-1}

# On the login node: fills the depot, builds the MPI wrapper, fetches meshes.
prepare:
  stage: prepare
  tags: [otus-shell]
  variables:
    JULIA_NUM_PRECOMPILE_TASKS: "8"
  script:
    - echo "checkout in $CI_PROJECT_DIR, depot in $JULIA_DEPOT_PATH"
    - hpc/install_mpiwrapper.sh "$CI_DEPOT_ROOT/mpiwrapper"
    - export MPITRAMPOLINE_LIB=$(ls "$CI_DEPOT_ROOT"/mpiwrapper/lib*/libmpiwrapper.so | head -n 1)
    - julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
    - julia --project=test -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
    - julia --project=hpc -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
    - julia --project=test -e 'using Trixi; Trixi.MPI.versioninfo()'
    - julia --project -e 'using MaxwellTrixi; foreach(download_mesh, keys(MaxwellTrixi.MESH_REGISTRY))'
  artifacts:
    paths: [Manifest.toml, test/Manifest.toml, hpc/Manifest.toml, meshes/]
    expire_in: 1 week

# One case per job. CASE selects the testset in test/test_hpc.jl, VARIANT one
# of its variants; results land in results/<case>/<variant>/.
.case:
  stage: run
  needs: [prepare]
  variables:
    VARIANT: default
  script:
    - export RESULTS=results/$CASE/$VARIANT
    - mkdir -p $RESULTS
    - echo "case $CASE, variant $VARIANT, $JULIA_NUM_THREADS threads, Slurm job $SLURM_JOB_ID"
    - TRIXI_TEST=hpc_$CASE HPC_VARIANT=$VARIANT julia --project=hpc -e 'using TestReports; TestReports.test("MaxwellTrixi"; logfilepath = ENV["RESULTS"], logfilename = "junit.xml")'
  artifacts:
    when: always
    paths: [results/]
    reports:
      junit: results/*/*/junit.xml
      metrics: results/*/*/metrics.txt
    expire_in: 4 weeks

validation:
  extends: .case
  rules:
    - if: $FAMILIES =~ /validation/
  variables:
    SCHEDULER_PARAMETERS: "$SCHEDULER_BASE -t 04:00:00 -N 1 -c 32"
  parallel:
    matrix:
      - CASE: [mie, mie_drude, dielectric_sphere, pec_sphere, slab, slab_dispersive]

validation_gold:
  extends: .case
  rules:
    - if: $FAMILIES =~ /validation/
  variables:
    CASE: gold_nanosphere
    SCHEDULER_PARAMETERS: "$SCHEDULER_BASE -t 12:00:00 -N 1 -c 96"

sweep_mie:
  extends: .case
  rules:
    - if: $FAMILIES =~ /sweep/
  variables:
    CASE: mie
    SCHEDULER_PARAMETERS: "$SCHEDULER_BASE -t 06:00:00 -N 1 -c 32"
  parallel:
    matrix:
      - VARIANT: [h30, h15, h10, p2, p4]

sweep_slab:
  extends: .case
  rules:
    - if: $FAMILIES =~ /sweep/
  variables:
    CASE: slab
    SCHEDULER_PARAMETERS: "$SCHEDULER_BASE -t 04:00:00 -N 1 -c 32"
  parallel:
    matrix:
      - VARIANT: [n14, n56, p2, p4]

# Full Mie runs per thread count; Trixi's indicators in metrics.txt give the scaling.
scaling:
  extends: .case
  rules:
    - if: $FAMILIES =~ /scaling/
  variables:
    CASE: mie
    VARIANT: "t$THREADS"
    SCHEDULER_PARAMETERS: "$SCHEDULER_BASE -t 04:00:00 -N 1 -c $THREADS"
  parallel:
    matrix:
      - THREADS: ["1", "2", "4", "8", "16"]
